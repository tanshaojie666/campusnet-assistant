name: Bug 反馈
description: 校园网连不上、代理没被关掉、翻墙模式没反应……
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        请先跑一次自检，它会一次性给出大部分需要的信息：

        ```bat
        python -m campusnet --selftest
        ```

        ⚠️ **贴出来之前请把账号打码**（密码不会被打印）。

  - type: textarea
    id: what
    attributes:
      label: 发生了什么
      description: 你期望的结果 vs 实际结果
      placeholder: 期望连上校园网，但一直显示"未联网"…
    validations:
      required: true

  - type: textarea
    id: selftest
    attributes:
      label: --selftest 输出
      render: text
      placeholder: 把自检输出粘在这里（账号请打码）
    validations:
      required: true

  - type: dropdown
    id: access
    attributes:
      label: 你们学校的接入方式
      options:
        - 有线 - PPPoE 拨号（有个"宽带连接"）
        - 有线 - 插上就有 IP（DHCP）
        - 有线 - 静态 IP
        - 有线 - 网页门户认证
        - 有线 - 学校专用客户端
        - 有线 - 802.1X
        - 无线 - 连 SSID 就能用
        - 无线 - 连上后要过网页认证
        - 不确定
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 版本
      description: 界面标题栏或 `python -m campusnet` 输出的版本号
      placeholder: v1.3.0
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows 版本
      placeholder: Windows 11 23H2 / Windows 10 22H2
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志（可选但很有用）
      description: 界面「打开日志」里的内容，或 `%LOCALAPPDATA%\CampusNetAssistant\运行日志.txt`
      render: text

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我已确认贴出的内容里没有真实账号、密码、订阅链接或 token
          required: true
